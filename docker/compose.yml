# Cobalt. Use ./start.sh and ./stop.sh rather than driving compose directly —
# they pick the right overlays and detect the VPN case. Equivalent by hand:
#
#   docker compose -f docker/compose.yml up -d
#   docker compose -f docker/compose.yml --profile llm up -d
#
# The app runs alone by default: the model server sits behind the `llm` profile
# so a plain start costs no RAM and triggers no multi-GB download.
#
# There is deliberately no database service: SQLite is a file, not a server.
# It lives in the cobalt-data volume, shared by the web and etl containers.

name: cobalt

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: cobalt:latest
    ports:
      - "${COBALT_PORT:-5173}:8000"
    volumes:
      - cobalt-data:/data
      # Edit pages without rebuilding. Drop this line for a sealed deployment.
      - ../web:/app/web:ro
    environment:
      COBALT_DB: /data/cobalt.db
      TZ: ${TZ:-UTC}
      # Reachable whether ollama runs here, on the host, or on another box.
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-cobalt}
      FRED_API_KEY: ${FRED_API_KEY:-}
    # Reach the host's ollama from inside the bridge network. Ignored under
    # host networking, where 127.0.0.1 already is the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    # No depends_on ollama: the app must start and serve pages whether or not a
    # model server exists. Only /api/summarize needs it, and it can fail alone.

  # One-shot ingest. Same image, different command:
  #   docker compose run --rm etl --section macro
  etl:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: cobalt:latest
    volumes:
      - cobalt-data:/data
    environment:
      COBALT_DB: /data/cobalt.db
      TZ: ${TZ:-UTC}
      FRED_API_KEY: ${FRED_API_KEY:-}
    entrypoint: ["python", "-m", "etl.run"]
    profiles: ["tools"]
    restart: "no"

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
    profiles: ["llm"]
    restart: unless-stopped

  # Pulls the model into the ollama-models volume, then exits. Runs once;
  # afterwards the weights are cached and this is a no-op.
  #   docker compose --profile llm run --rm model-init
  model-init:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-cobalt}
    # depends_on only waits for the container, not for the server to listen,
    # so poll before pulling rather than racing it.
    entrypoint:
      - /bin/sh
      - -c
      - |
        for i in $$(seq 1 60); do
          ollama list >/dev/null 2>&1 && break
          echo "waiting for ollama ($$i/60)"; sleep 2
        done
        ollama pull "$${OLLAMA_BASE_MODEL:-qwen3.5:9b}"
    profiles: ["llm"]
    restart: "no"

volumes:
  # The SQLite database and the raw-response cache. Named rather than a bind
  # mount so it works identically on Linux, macOS and Windows without host
  # permission juggling. Back it up with:
  #   docker run --rm -v cobalt_cobalt-data:/d -v "$PWD":/b alpine \
  #     tar czf /b/cobalt-data.tar.gz -C /d .
  cobalt-data:

  # Model weights — several GB. Named so `docker compose down` never costs you
  # a re-download.
  ollama-models:
