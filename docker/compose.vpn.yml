# VPN overlay. A kill switch that drops non-tunnel traffic (Mullvad, ProtonVPN
# and friends) breaks Docker's bridge network in two places at once, which is
# why both fixes live here:
#
#   build   - BuildKit cannot resolve DNS, so pip cannot reach PyPI
#   runtime - connections to published ports die even though docker-proxy
#             is listening
#
# ./start.sh applies this automatically when it detects the condition.
#
# Linux only. The cleaner fix is to allow local network sharing in the VPN
# client, which keeps the portable bridge setup working for everyone else:
#   mullvad lan set allow

services:
  etl:
    build:
      network: host

  web:
    build:
      network: host
    network_mode: host
    ports: !reset []
    environment:
      COBALT_PORT: ${COBALT_PORT:-5173}
    # Loopback, not 0.0.0.0 — in host mode 0.0.0.0 would expose the app to the
    # whole LAN rather than just this machine.
    command:
      - uvicorn
      - app.main:app
      - --host
      - 127.0.0.1
      - --port
      - ${COBALT_PORT:-5173}
    healthcheck:
      test: ["CMD", "python", "-c",
             "import os,sys,urllib.request; p=os.environ.get('COBALT_PORT','5173'); sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:'+p+'/api/health').status==200 else 1)"]
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 3
